server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: ezkey-backend
  jackson:
    default-property-inclusion: always

# ---------------------------------------------------------------------------
# All values below are read from the SAME environment variables that the
# Next.js app already uses (.env.local). The env file is never modified or
# duplicated - see DotEnvEnvironmentPostProcessor, which loads ../.env.local
# into the Spring Environment at startup.
# ---------------------------------------------------------------------------
ezkey:
  supabase:
    url: ${NEXT_PUBLIC_SUPABASE_URL:}
    anon-key: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  site-url: ${NEXT_PUBLIC_SITE_URL:http://localhost:3000}
  didit:
    api-base-url: ${DIDIT_API_BASE_URL:https://verification.didit.me}
    api-key: ${DIDIT_API_KEY:}
    webhook-secret: ${DIDIT_WEBHOOK_SECRET:}
  cors:
    # Comma separated list of allowed browser origins for the Next.js frontend.
    allowed-origins: ${BACKEND_CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  cookies:
    secure: ${BACKEND_COOKIE_SECURE:false}

logging:
  level:
    com.ezkey: INFO
